experiment:
  brand: "Grand Horizon Hotels & Resorts"
  seed: 42
  n_dmas: 50
  pre_weeks: 20
  post_weeks: 4
  holdout_share: 0.20          # 10 of 50 DMAs paused (T=1); 40 kept (T=0)
  stratify_by: market_tier
  tier_shares: {1: 0.20, 2: 0.40, 3: 0.40}   # Major hub / Regional / Drive-to

economics:
  ota_commission_by_tier: {1: 0.20, 2: 0.175, 3: 0.15}   # variable 15-20%
  avg_direct_adr_nights: 2.4
  branded_cpc: {1: 3.20, 2: 2.20, 3: 1.50}
  # Policy: pause only if predicted net margin gain of pausing is positive
  policy_margin_threshold: 0.0

gpu:
  use_gpu: true                # auto-falls back to CPU when CUDA is unavailable
  xgboost: {device: cuda, tree_method: hist}
  catboost: {task_type: GPU}
  lightgbm: {device_type: cpu}  # LightGBM GPU needs a custom build; CPU is the safe default
  rapids_optional: true
  jax_platform: auto

models:
  nuisance:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
  cv_folds: 5
  causal_forest: {n_estimators: 400, min_samples_leaf: 20, max_depth: 8}
  deep:
    hidden: 64
    rep_dim: 32
    epochs: 200
    lr: 0.001
    weight_decay: 0.0001
    batch_size: 256
    patience: 20
    dragonnet_alpha: 1.0
    dragonnet_beta: 1.0
  bsts: {num_warmup: 400, num_samples: 600, num_chains: 2}
  sdid: {ridge_zeta_scale: 1.0}
  n_permutations: 5000

paths:
  models: outputs/models
  metrics: outputs/metrics
  plots: outputs/plots
  screenshots: outputs/screenshots
  data: data
