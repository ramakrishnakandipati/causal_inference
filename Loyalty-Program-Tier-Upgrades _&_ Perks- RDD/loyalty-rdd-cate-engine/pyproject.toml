[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "loyalty-rdd-cate-engine"
version = "0.1.0"
description = "GPU-accelerated RDD + CATE engine for hotel loyalty tier upgrades"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<2.0",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "linearmodels>=5.3",
  "rdrobust>=1.2",
  "econml>=0.14",
  "causalml>=0.15",
  "xgboost>=1.7",
  "lightgbm>=3.3",
  "catboost>=1.2",
  "optuna>=3.0",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "plotly>=5.9,<6",  # plotly 6+ emits binary arrays that Streamlit 1.12 cannot render
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "pydantic>=2.0",
  "httpx>=0.23",
  "streamlit>=1.12",  # Python 3.9.7 is excluded by newer streamlit; 1.12 needs altair<5, protobuf<4
  "altair<5",
  "protobuf<4",
  "playwright>=1.40",
  "pytest>=7.0",
]

[project.optional-dependencies]
# torch must be installed from the CUDA index, see Makefile `setup`
gpu = ["cupy-cuda12x", "cuml-cu12"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
